services:
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - mobile_node_modules:/app/node_modules
    environment:
      EXPO_NO_DOCTOR: "1"
    stdin_open: true
    tty: true

volumes:
  mobile_node_modules:
